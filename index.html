
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cita pt.2 💗</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: 'Trebuchet MS', sans-serif;
    overflow: hidden;
    background: #fce9b9;
}

/* Fondo playa pixel art */
.background {
    position: fixed;
    inset: 0;
    background-image: url("playa.png");
    background-size: cover;
    background-position: center;
    z-index: -2;
}

.background::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255, 245, 218, 0.20);
}

/* Contenedor principal */
.container {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.card {
    width: min(100%, 390px);
    padding: 25px 20px;
    text-align: center;
    background: rgba(255, 252, 237, 0.91);
    border: 4px solid white;
    border-radius: 28px;
    box-shadow: 0 8px 25px rgba(90, 100, 120, .20);
    backdrop-filter: blur(5px);
}

h1 {
    color: #e77ba9;
    font-size: clamp(27px, 8vw, 36px);
    margin-bottom: 8px;
}

.subtitle {
    color: #a87886;
    font-size: 15px;
    margin-bottom: 12px;
}

/* Gatito */
.cat {
    width: 190px;
    height: 240px;
    object-fit: contain;
    display: block;
    margin: 0 auto 10px;
    filter: drop-shadow(0 5px 0 white);
    animation: float 2s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}

/* Botones */
.buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    min-height: 65px;
    position: relative;
}

button {
    border: none;
    border-radius: 18px;
    padding: 13px 25px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform .2s, background .2s;
}

#yes {
    color: white;
    background: #f28bb7;
    box-shadow: 0 5px 0 #d76b99;
}

#yes:hover {
    transform: scale(1.08);
}

#no {
    color: #a87886;
    background: #fff;
    box-shadow: 0 5px 0 #ead1dc;
    position: relative;
    z-index: 5;
}

.hint {
    color: #bd91a1;
    font-size: 12px;
    margin-top: 18px;
}

/* Pantalla de aceptación */
.success {
    display: none;
}

.success h1 {
    margin-bottom: 15px;
}

.success p {
    color: #a87886;
    line-height: 1.6;
    margin-bottom: 18px;
}

.success img {
    width: 180px;
    height: 200px;
    object-fit: contain;
}

#whatsapp {
    display: inline-block;
    text-decoration: none;
    background: #35bd72;
    color: white;
    padding: 14px 20px;
    border-radius: 15px;
    font-weight: bold;
}

/* Corazones */
.heart {
    position: fixed;
    bottom: -30px;
    font-size: 25px;
    pointer-events: none;
    animation: rise 4s linear forwards;
    z-index: 10;
}

@keyframes rise {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

@media (max-width: 380px) {
    .card { padding: 20px 12px; }
    .cat { width: 160px; height: 205px; }
}
</style>
</head>

<body>

<div class="background"></div>

<main class="container">
    <section class="card" id="question">

        <h1>¿Cita pt.2? 💗</h1>

        <p class="subtitle">
            Tengo algo que preguntarte... 👉👈
        </p>

        <img src="gato.png" class="cat" alt="Gatito kawaii">

        <div class="buttons">
            <button id="yes">¡SÍ! 💗</button>
            <button id="no">No 🙈</button>
        </div>

        <p class="hint">Elige sabiamente... ฅ^•ﻌ•^ฅ</p>
    </section>

    <section class="card success" id="success">

        <h1>¡SABÍA QUE SÍ! 💗</h1>

        <img src="gato.png" alt="Gatito feliz">

        <p>
            AAAAAA 🥹💕<br>
            Me acabas de hacer muy feliz.<br>
            ¡Tenemos una cita pt.2!
        </p>

        <a id="whatsapp" href="#" target="_blank" rel="noopener">
            Avisarme por WhatsApp 💌
        </a>

    </section>
</main>

<script>
const yes = document.getElementById("yes");
const no = document.getElementById("no");
const question = document.getElementById("question");
const success = document.getElementById("success");

// Número con código de país, sin + ni espacios.
const MI_NUMERO = "56912345678";

// Botón NO fugitivo
let attempts = 0;

function moveNo() {
    attempts++;

    const margin = 15;
    const maxX = window.innerWidth - no.offsetWidth - margin;
    const maxY = window.innerHeight - no.offsetHeight - margin;

    const x = margin + Math.random() * Math.max(0, maxX - margin);
    const y = margin + Math.random() * Math.max(0, maxY - margin);

    no.style.position = "fixed";
    no.style.left = x + "px";
    no.style.top = y + "px";

    // Después de varios intentos, le recordamos
    // que su respuesta siempre importa.
    if (attempts >= 7) {
        document.querySelector(".hint").textContent =
            "Jajaja, puedes responder con sinceridad 💗";
    }
}

no.addEventListener("pointerenter", moveNo);
no.addEventListener("touchstart", (event) => {
    event.preventDefault();
    moveNo();
}, { passive: false });

// Si consigue presionar NO
no.addEventListener("click", () => {
    alert("¡Gracias por responder! 💗");
});

// Al presionar SÍ
yes.addEventListener("click", () => {
    question.style.display = "none";
    success.style.display = "block";

    createHearts();

    const message = encodeURIComponent(
        "¡¡¡Aceptó la cita pt.2!!! 💗🥹"
    );

    document.getElementById("whatsapp").href =
        `https://wa.me/${MI_NUMERO}?text=${message}`;
});

// Lluvia de corazones
function createHearts() {
    const emojis = ["💗", "💕", "💖", "💘", "✨", "🌸"];

    for (let i = 0; i < 45; i++) {
        setTimeout(() => {
            const heart = document.createElement("div");
            heart.className = "heart";
            heart.textContent =
                emojis[Math.floor(Math.random() * emojis.length)];

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration =
                (3 + Math.random() * 3) + "s";

            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 6000);
        }, i * 100);
    }
}
</script>

</body>
</html>
